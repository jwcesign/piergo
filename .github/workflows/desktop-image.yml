name: Desktop image

on:
  pull_request:
    paths: ["hack/**", ".github/workflows/desktop-image.yml"]
  push:
    branches: [main]
    paths: ["hack/**", ".github/workflows/desktop-image.yml"]
  workflow_dispatch:
    inputs:
      debian_image:
        description: Debian image (empty uses hack/versions.env)
        type: string
      node_image:
        description: Node image
        type: string
      cua_spacesd_version:
        description: Cua spacesd version
        type: string
      cua_driver_version:
        description: Cua Driver version
        type: string
      codex_version:
        description: Codex version
        type: string
      browseros_version:
        description: BrowserOS Neo version (without v)
        type: string
      image_tag:
        description: Image tag (empty uses sha-<commit>)
        type: string
      publish:
        description: Push to Amazon ECR Public
        type: boolean
        default: true

concurrency:
  group: desktop-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PIERGO_DEBIAN_IMAGE: ${{ inputs.debian_image }}
      PIERGO_NODE_IMAGE: ${{ inputs.node_image }}
      PIERGO_CUA_SPACESD_VERSION: ${{ inputs.cua_spacesd_version }}
      PIERGO_CUA_DRIVER_VERSION: ${{ inputs.cua_driver_version }}
      PIERGO_CODEX_VERSION: ${{ inputs.codex_version }}
      PIERGO_BROWSEROS_VERSION: ${{ inputs.browseros_version }}
      INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      IMAGE: public.ecr.aws/cloudpilotai/piergo-codex
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build parameters
        id: prepare
        run: |
          tag="${INPUT_IMAGE_TAG:-sha-${GITHUB_SHA:0:12}}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          {
            printf 'image_tag=%s\nbuild_args<<EOF\n' "$tag"
            ./hack/build-image.sh --print-build-args
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Amazon ECR Public
        if: env.PUBLISH == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/cloudpilotai
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: hack
          file: hack/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.prepare.outputs.image_tag }}
          build-args: ${{ steps.prepare.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
